apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: cv-platform
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_DB, value: cvplatform}
            - {name: POSTGRES_USER, value: cvplatform}
            - {name: POSTGRES_PASSWORD, value: cvplatform}
          ports:
            - containerPort: 5432
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init-sql, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "cvplatform"]}
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: init-sql
          configMap:
            name: postgres-init-sql
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cv-platform
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
  clusterIP: None
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: cv-platform
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: cv-platform
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: cv-platform
spec:
  replicas: 1
  selector:
    matchLabels: {app: minio}
  template:
    metadata:
      labels: {app: minio}
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - {name: MINIO_ROOT_USER, value: cvplatform}
            - {name: MINIO_ROOT_PASSWORD, value: cvplatform123}
          ports: [{containerPort: 9000}, {containerPort: 9001}]
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: cv-platform
spec:
  selector: {app: minio}
  ports:
    - {name: api, port: 9000, targetPort: 9000}
    - {name: console, port: 9001, targetPort: 9001}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: cv-platform
data:
  001_init.sql: |
    -- Partitioned by month so old partitions can be detached and archived
    -- without touching hot (recent) data. See docs/design-decisions.md.
    CREATE TABLE IF NOT EXISTS images (
        image_id       TEXT NOT NULL,
        filename       TEXT NOT NULL,
        content_type   TEXT NOT NULL,
        size_bytes     BIGINT NOT NULL,
        uploaded_at    TIMESTAMPTZ NOT NULL,
        processed_at   TIMESTAMPTZ,
        success        BOOLEAN,
        error_message  TEXT,
        processing_ms  INTEGER,
        detections     JSONB,
        PRIMARY KEY (image_id, uploaded_at)
    ) PARTITION BY RANGE (uploaded_at);

    CREATE TABLE IF NOT EXISTS images_default PARTITION OF images DEFAULT;

    CREATE INDEX IF NOT EXISTS idx_images_uploaded_at ON images (uploaded_at DESC);
    CREATE INDEX IF NOT EXISTS idx_images_status ON images (success) WHERE processed_at IS NOT NULL;

    -- Example of a monthly partition to be created ahead of time by a
    -- scheduled job (not included in this scaffold):
    -- CREATE TABLE images_2026_09 PARTITION OF images
    --   FOR VALUES FROM ('2026-09-01') TO ('2026-10-01');
