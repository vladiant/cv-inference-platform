apiVersion: apps/v1
kind: Deployment
metadata:
  name: cv-inference-cpp
  namespace: cv-platform
spec:
  replicas: 2
  selector:
    matchLabels: {app: cv-inference-cpp}
  template:
    metadata:
      labels: {app: cv-inference-cpp}
    spec:
      containers:
        - name: cv-inference-cpp
          image: cv-platform/cv-inference-cpp:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 50051}]
          resources:
            requests: {cpu: "1", memory: 512Mi}
            limits: {cpu: "2", memory: 1Gi}
          readinessProbe:
            grpc: {port: 50051}
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cv-inference-cpp
  namespace: cv-platform
spec:
  selector: {app: cv-inference-cpp}
  ports: [{port: 50051, targetPort: 50051}]
