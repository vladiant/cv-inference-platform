apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: cv-platform
spec:
  replicas: 2
  selector:
    matchLabels: {app: ingestion}
  template:
    metadata:
      labels: {app: ingestion}
    spec:
      containers:
        - name: ingestion
          image: cv-platform/ingestion:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          env:
            - {name: REDIS_URL, value: "redis://redis:6379/0"}
            - {name: POSTGRES_DSN, value: "postgresql://cvplatform:cvplatform@postgres:5432/cvplatform"}
            - {name: MINIO_ENDPOINT, value: "minio:9000"}
            - {name: MINIO_ACCESS_KEY, value: "cvplatform"}
            - {name: MINIO_SECRET_KEY, value: "cvplatform123"}
          resources:
            requests: {cpu: "100m", memory: 128Mi}
            limits: {cpu: "500m", memory: 256Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion
  namespace: cv-platform
spec:
  selector: {app: ingestion}
  ports: [{port: 8000, targetPort: 8000}]
  type: ClusterIP
