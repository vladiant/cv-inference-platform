syntax = "proto3";

package cvinference;

// Stateless inference service. Kept intentionally small: one image in,
// one result out. Batching, if ever needed, would be a separate RPC
// (InferBatch) rather than overloading this one.
service Inference {
  rpc InferImage (InferRequest) returns (InferResponse);
}

message InferRequest {
  string image_id = 1;
  bytes image_data = 2;      // raw encoded image bytes (jpg/png)
  string operation = 3;      // e.g. "face_detect", "edge_detect"
}

message InferResponse {
  string image_id = 1;
  bool success = 2;
  string error_message = 3;
  repeated Detection detections = 4;
  int32 processing_ms = 5;
}

message Detection {
  string label = 1;
  float confidence = 2;
  int32 x = 3;
  int32 y = 4;
  int32 width = 5;
  int32 height = 6;
}
